minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# These releases patch published advisories and are still inside the 7-day
# window. Exempt these versions only so frozen installs can resolve them.
# argparse@3.0.3 is required by markdown-it@15.0.3 (^3.0.3).
minimumReleaseAgeExclude:
  - markdown-it@15.0.3
  - argparse@3.0.3
trustPolicy: no-downgrade
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
blockExoticSubdeps: true
allowBuilds:
  esbuild: true
  # wrangler-action installs wrangler on site deploy; wrangler needs workerd's
  # postinstall to unpack the native binary (ERR_PNPM_IGNORED_BUILDS otherwise).
  workerd: true
# Transitive CVE pins. Parent selectors leave other majors alone
# (undici 8.x, and brace-expansion 1.x vs 5.x).
# Versions are the newest releases that satisfy the 7-day minimumReleaseAge.
overrides:
  "minimatch@3>brace-expansion": 1.1.21
  "minimatch@10>brace-expansion": 5.0.12
